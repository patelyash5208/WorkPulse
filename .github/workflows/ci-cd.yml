name: Backend CI

on:
  push:
    branches:
      - main # Trigger CI on pushes to the main branch

jobs:
  build-test-deploy:
    name: Build, Test & Deploy
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22]

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # 3. Install backend dependencies
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          npm ci

      # 4. Run backend tests
      - name: Run Backend Tests
        working-directory: ./backend
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
        run: npm test

      # 5. Install frontend dependencies & build
      - name: Install Frontend Dependencies & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # 6. Create .env file for backend
      - name: Add Production Secrets
        working-directory: ./backend
        run: |
          cat <<EOF > .env
          MONGO_URI=${{ secrets.MONGO_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PORT=${{ secrets.PORT }}
          EOF

      # 7. Restart PM2 services
      - name: Restart PM2 Services
        run: pm2 restart all || pm2 start ecosystem.config.js
