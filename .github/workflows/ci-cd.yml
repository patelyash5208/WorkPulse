name: Backend CI/CD

on:
  push:
    branches:
      - main # Trigger on pushes to main branch

jobs:
  deploy:
    name: Deploy Backend & Frontend
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22]

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # 3. Print Secrets (for debugging only, remove in production!)
      - name: Print Env Secrets
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
        run: |
          echo "Using Mongo URI: $MONGO_URI"
          echo "Using JWT Secret: $JWT_SECRET"
          echo "Using Port: $PORT"

      # 4. Install Backend Dependencies
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          npm install --global yarn
          yarn install

      # 5. Install Frontend Dependencies & Build
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          yarn install
          yarn run build

      # 6. Run Backend Tests
      - name: Run Backend Tests
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
        working-directory: ./backend
        run: npm test

      # 7. Setup Environment File for Backend
      - name: Setup Environment
        working-directory: ./backend
        run: |
          touch .env
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env

      # 8. Restart PM2 Services
      - name: Restart PM2 Services
        working-directory: ./backend
        run: |
          pm2 stop all || true
          pm2 delete all || true
          pm2 start ecosystem.config.js --env production
          pm2 save
